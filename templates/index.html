<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Emotion Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        h1 { color: #333; }
        textarea { width: 100%; height: 100px; padding: 10px; font-size: 14px; }
        button { margin-top: 10px; padding: 10px 24px; background: #0062ff; color: white; border: none; cursor: pointer; font-size: 14px; border-radius: 4px; }
        button:hover { background: #0043ce; }
        #result { margin-top: 20px; padding: 16px; background: #f4f4f4; border-left: 4px solid #0062ff; font-size: 15px; }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter customer feedback below to analyze its emotional content:</p>
    <textarea id="textToAnalyze" placeholder="Type your text here..."></textarea>
    <br/>
    <button onclick="analyzeEmotion()">Analyze Emotion</button>
    <div id="result"></div>

    <script>
        function analyzeEmotion() {
            const text = document.getElementById('textToAnalyze').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Analyzing...';

            fetch('/emotionDetector?textToAnalyze=' + encodeURIComponent(text))
                .then(response => response.text())
                .then(data => { resultDiv.innerHTML = data; })
                .catch(() => { resultDiv.innerHTML = 'Error occurred. Please try again.'; });
        }
    </script>
</body>
</html>
